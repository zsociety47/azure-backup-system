# Calls the shared apply job. Do not set a GitHub environment:
# that would change the OpenID Connect subject and Azure would refuse it.
# A push to main runs this job. A pull request cannot start it.

name: Apply
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  apply:
    uses: zsociety47/cloud-projects/.github/workflows/azure-terraform-apply.yml@main
    secrets: inherit
